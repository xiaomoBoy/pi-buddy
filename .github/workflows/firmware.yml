name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build lichuang-dev
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build lichuang-dev
        working-directory: firmware/xiaozhi
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev

      - name: Upload merged-binary.bin
        uses: actions/upload-artifact@v7
        with:
          name: lichuang-dev-${{ steps.sha.outputs.short }}
          path: firmware/xiaozhi/build/merged-binary.bin
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/xiaozhi/build/merged-binary.bin
          fail_on_unmatched_files: true
