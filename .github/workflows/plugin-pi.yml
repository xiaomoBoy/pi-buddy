name: plugin-pi

on:
  pull_request:
    paths:
      - "plugins/pi/**"
      - ".github/workflows/plugin-pi.yml"
  push:
    paths:
      - "plugins/pi/**"
      - ".github/workflows/plugin-pi.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            plugins/pi/package-lock.json
            bridge/package-lock.json
      - name: Install bridge
        working-directory: bridge
        run: npm ci
      - name: Install plugin
        working-directory: plugins/pi
        run: npm ci
      - name: Typecheck
        working-directory: plugins/pi
        run: npm run typecheck
      - name: Test
        working-directory: plugins/pi
        run: npm test
